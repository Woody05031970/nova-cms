name: Installationspaket

# Baut das ZIP für Webspaces (mit vendor). Manuell unter Actions starten
# oder automatisch bei einem Versions-Tag wie v0.1.0 (dann auch als GitHub-Release).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  paket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.3
          extensions: mbstring, zip, pdo, sqlite, pdo_sqlite, sodium
          coverage: none

      - name: Paket bauen
        run: scripts/release.sh dist

      - name: Paket bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: nova-cms-installationspaket
          path: dist/*.zip

      - name: Als Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Nova CMS $GITHUB_REF_NAME" --notes "Installationspaket für Webspaces: entpacken und den Inhalt des Ordners nova-cms per FTP hochladen."
